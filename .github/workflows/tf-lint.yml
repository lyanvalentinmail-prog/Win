name: tf-lint

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/tf-lint.yml"]
  push:
    branches: [main]
    paths: ["infra/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: fmt + init + validate + tflint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        modulo: [azure, aws, kvm]
    defaults:
      run:
        working-directory: infra/${{ matrix.modulo }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: terraform fmt -check
        run: |
          # 'terraform fmt -check' sale con codigo 3 cuando hay ficheros por formatear y el
          # log de Actions es dificil de leer desde una API: el diff se convierte en
          # anotaciones del check (se ven en la pestana "Files changed" del PR).
          # El '|| rc=$?' evita que 'set -e' aborte el paso antes de imprimir nada.
          rc=0
          terraform fmt -check -diff -recursive >fmt.diff 2>&1 || rc=$?
          cat fmt.diff
          if [ "$rc" -ne 0 ]; then
            echo "::error::el modulo no pasa 'terraform fmt'. Arreglo: terraform fmt -recursive infra/${{ matrix.modulo }}"
            ficheros=$(grep -E '^(---|\+\+\+)' fmt.diff | sed 's/^[+a-z-]* [ab]\///' | sort -u | head -8)
            for f in $ficheros; do
              echo "::error file=infra/${{ matrix.modulo }}/$f::necesita formato (terraform fmt)"
            done
            n=0
            while IFS= read -r linea; do
              n=$((n + 1))
              [ "$n" -gt 40 ] && break
              echo "::error::fmt| ${linea}"
            done < <(grep -E '^[+-][^+-]' fmt.diff | head -40)
            exit 1
          fi

      - name: terraform init
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0

      - name: tflint
        run: |
          tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl" || true
          tflint --config="$GITHUB_WORKSPACE/.tflint.hcl" --format=compact
