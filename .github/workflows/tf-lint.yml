name: tf-lint

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/tf-lint.yml"]
  push:
    branches: [main]
    paths: ["infra/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: fmt + init + validate + tflint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        modulo: [azure, aws, kvm]
    defaults:
      run:
        working-directory: infra/${{ matrix.modulo }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: terraform fmt -check
        run: |
          # 'terraform fmt -check' devuelve un codigo distinto de 0 (3 en Terraform 1.9)
          # cuando hay ficheros por formatear. Ademas del diff en el log, lo convertimos en
          # anotaciones para que el fallo se lea en la pestana de archivos del PR.
          terraform fmt -check -diff -recursive >fmt.diff 2>&1
          rc=$?
          cat fmt.diff
          if [ "$rc" -ne 0 ]; then
            echo "::error::el modulo no pasa 'terraform fmt'; ejecuta: terraform fmt -recursive infra/${{ matrix.modulo }}"
            grep -E '^(---|\+\+\+)' fmt.diff | sed 's/%/%25/g' | head -20 | while IFS= read -r fich; do
              echo "::error::necesita formato: ${fich#*  }"
            done
            grep -E '^[+-][^+-]' fmt.diff | sed 's/%/%25/g' | head -40 | while IFS= read -r linea; do
              echo "::error::fmt ${linea}"
            done
            exit 1
          fi

      - name: terraform init
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0

      - name: tflint
        run: |
          tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl" || true
          tflint --config="$GITHUB_WORKSPACE/.tflint.hcl" --format=compact
