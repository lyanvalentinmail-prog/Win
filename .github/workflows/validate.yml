name: validate

# Todo lo que se puede comprobar SIN una VM (config, JSON schemas, catalogo, perfiles,
# sintaxis de los .ps1, secretos, enlaces). Es la puerta de entrada de cada PR.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo:
    name: Validar repo (config, apps, gaming, PowerShell, secretos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias del validador
        run: python -m pip install -r scripts/validate/requirements.txt

      - name: Validar
        run: python scripts/validate/validate.py --verbose

      - name: Pruebas del validador y de los datos
        run: python -m pytest -q

      - name: Los JSON se parsean (comprobacion independiente del validador)
        run: |
          shopt -s nullglob
          for f in config/*.json apps/*.json apps/sources.json apps/selections/*.json gaming/profiles/*.json gaming/touch/layouts/*.json; do
            python -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" "$f" && echo "OK $f"
          done

  powershell-analisis:
    name: Analisis estatico de PowerShell (PSScriptAnalyzer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $settings = Join-Path $PWD 'scripts/validate/PSScriptAnalyzerSettings.psd1'
          $hallazgos = @()
          foreach ($f in Get-ChildItem scripts/win -Recurse -Include *.ps1,*.psm1,*.psd1) {
            if (Test-Path $settings) { $hallazgos += Invoke-ScriptAnalyzer -Path $f.FullName -Settings $settings }
            else { $hallazgos += Invoke-ScriptAnalyzer -Path $f.FullName }
          }
          $hallazgos | Format-Table -AutoSize Severity, RuleName, Line, ScriptPath | Out-String -Width 200 | Write-Host
          if ($hallazgos | Where-Object Severity -eq 'Error') { throw 'PSScriptAnalyzer reporto errores' }

  pwsh-sintaxis:
    name: Parseo con PowerShell 7
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Parsing de todos los scripts
        shell: pwsh
        run: |
          $errores = 0
          foreach ($f in Get-ChildItem scripts -Recurse -Include *.ps1,*.psm1) {
            $tokens = $null; $fallos = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$fallos)
            foreach ($e in $fallos) { $errores++; Write-Host "$($f.Name): $($e.Message)" -ForegroundColor Red }
            if (-not $fallos) { Write-Host "OK $($f.Name)" }
          }
          if ($errores -gt 0) { throw "$errores errores de sintaxis" }
      - name: Enlaces internos de la documentacion
        run: python scripts/validate/check_links.py
